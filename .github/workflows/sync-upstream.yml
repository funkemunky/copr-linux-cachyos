name: Sync upstream branches

on:
  schedule:
    # This runs at 06:00 UTC, which is 01:00 EST (UTC-5) and 02:00 EDT (UTC-4).
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync branches from upstream master
        run: |
          set -euo pipefail
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/CachyOS/copr-linux-cachyos.git
          else
            git remote add upstream https://github.com/CachyOS/copr-linux-cachyos.git
          fi
          git fetch upstream master

          failed_branches=()
          for branch in master x86_64-v3; do
            echo "Syncing ${branch} from upstream/master"
            git checkout "$branch" 2>/dev/null || git checkout --create "$branch"
            git reset --hard upstream/master
            if ! git push origin "$branch" --force; then
              echo "::error::Failed to push ${branch}. Check token permissions and branch protection rules."
              failed_branches+=("$branch")
            fi
          done

          if [ "${#failed_branches[@]}" -gt 0 ]; then
            echo "::error::Sync failed for branch(es): ${failed_branches[*]}"
            exit 1
          fi
