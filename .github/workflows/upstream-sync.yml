name: Upstream Sync & HP Kernel Spec Merge

on:
  schedule:
    # Runs every day at 3:00 AM UTC (03:00 UTC)
    # Note: If you want 3:00 AM EDT (UTC-4), change this to '0 7 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up upstream remote
        run: |
          git remote add upstream https://github.com/CachyOS/copr-linux-cachyos.git || git remote set-url upstream https://github.com/CachyOS/copr-linux-cachyos.git
          git fetch upstream master

      - name: Backup base kernel spec before upstream merge
        run: |
          mkdir -p /tmp/spec_backup
          cp sources/kernel-cachyos-bore/kernel-cachyos.spec /tmp/spec_backup/kernel-cachyos.spec.base

      - name: Merge upstream master
        id: merge_upstream
        run: |
          UPSTREAM_REV=$(git rev-parse upstream/master)
          MERGE_BASE=$(git merge-base HEAD upstream/master)

          if [ "$MERGE_BASE" = "$UPSTREAM_REV" ]; then
            echo "Repository is already up to date with upstream/master."
            echo "upstream_updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Merging upstream/master..."
            if ! git merge --no-edit -m "Merge branch 'CachyOS:master' into master" upstream/master; then
              echo "::error::Merge conflict encountered while merging upstream/master into master. Manual intervention required."
              exit 1
            fi
            echo "upstream_updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge changes into kernel-cachyos-hp.spec
        run: |
          python3 .github/scripts/merge-hp-spec.py \
            /tmp/spec_backup/kernel-cachyos.spec.base \
            sources/kernel-cachyos-bore/kernel-cachyos.spec \
            sources/kernel-cachyos-bore/kernel-cachyos-hp.spec

      - name: Commit and push changes
        run: |
          HP_SPEC="sources/kernel-cachyos-bore/kernel-cachyos-hp.spec"
          if ! git diff --quiet "$HP_SPEC"; then
            echo "Changes detected in $HP_SPEC. Committing..."
            git add "$HP_SPEC"
            git commit -m "Merge kernel-cachyos.spec updates into kernel-cachyos-hp.spec"
          else
            echo "No changes detected in $HP_SPEC."
          fi

          # Push changes (including upstream merge commit if created)
          git push origin master
